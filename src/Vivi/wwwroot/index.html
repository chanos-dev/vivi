<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vivi</title>
    <base href="/" />
    <script>
        // GitHub Pages 프로젝트 사이트(https://<user>.github.io/vivi/)에서는 앱이 하위 경로에 배포된다.
        // 빌드 산출물(index.html)을 수정하면 서비스 워커의 무결성 해시가 깨지므로, 런타임에 base 경로를 바꾼다.
        if (location.hostname.endsWith('.github.io')) {
            document.querySelector('base').setAttribute('href', '/vivi/');
        }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Gowun+Dodum&amp;family=Jua&amp;display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Vivi.styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF8F0" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vivi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        오류가 발생했습니다.
        <a href="." class="reload">새로고침</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
