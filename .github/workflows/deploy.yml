name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Vivi.slnx

      - name: Test
        run: dotnet test Vivi.slnx --no-restore --configuration Release

      - name: Publish
        run: dotnet publish src/Vivi/Vivi.csproj --no-restore --configuration Release --output publish

      - name: Prepare GitHub Pages output
        working-directory: publish/wwwroot
        run: |
          # SPA 딥링크(/vivi/tuner 등)를 위해 404 페이지로 index.html을 그대로 사용
          cp index.html 404.html
          # _framework 등 밑줄로 시작하는 폴더를 Jekyll이 무시하지 않도록
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: publish/wwwroot

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
